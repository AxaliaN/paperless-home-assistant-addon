---
name: Auto update

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if this Paperless version already has an image"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  update:
    name: Check Paperless release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set latest Paperless version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/paperless-ngx/paperless-ngx/releases/latest --jq .tag_name)
          sed -i "s/^ARG PAPERLESS_VERSION=.*/ARG PAPERLESS_VERSION=\"${latest}\"/" paperless-ngx/Dockerfile
          echo "version=${latest#v}" >> "$GITHUB_OUTPUT"
      - name: Choose image tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          FORCE: ${{ inputs.force }}
        run: |
          image="${OWNER,,}/paperless-ngx/amd64"
          exists() {
            token=$(curl -s "https://ghcr.io/token?scope=repository:${image}:pull" | jq -r .token)
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${image}/manifests/$1")
            [ "$code" = "200" ]
          }
          tag="$VERSION"
          if exists "$tag"; then
            if [ "$FORCE" != "true" ]; then
              echo "Image $tag already exists, nothing to do"
              exit 0
            fi
            n=1
            while exists "${VERSION}-${n}"; do n=$((n + 1)); done
            tag="${VERSION}-${n}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Refresh Debian pins
        if: steps.tag.outputs.tag != ''
        run: python3 .github/scripts/refresh_pins.py paperless-ngx/Dockerfile
      - name: Commit
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paperless-ngx/Dockerfile
          git diff --cached --quiet || git commit -m "Update to Paperless-ngx ${TAG} and refresh Debian pins"
          git push origin HEAD:main

  build:
    needs: update
    if: needs.update.outputs.tag != ''
    uses: ./.github/workflows/fork-build.yaml
    with:
      tag: ${{ needs.update.outputs.tag }}
