---
name: Fork build

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: Paperless version from Dockerfile)"
        required: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - "paperless-ngx/**"
      - ".github/workflows/fork-build.yaml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Compose flags
        id: flags
        env:
          INPUT_TAG: ${{ inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version=$(sed -n 's/^ARG PAPERLESS_VERSION="v\(.*\)"/\1/p' paperless-ngx/Dockerfile)
          echo "tag=${INPUT_TAG:-$version}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "from=$(yq '.build_from.amd64' paperless-ngx/build.yaml)" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: paperless-ngx
          file: paperless-ngx/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.flags.outputs.owner }}/paperless-ngx/amd64:${{ steps.flags.outputs.tag }}
            ghcr.io/${{ steps.flags.outputs.owner }}/paperless-ngx/amd64:latest
          build-args: |
            BUILD_ARCH=amd64
            BUILD_DATE=${{ steps.flags.outputs.date }}
            BUILD_DESCRIPTION=Paperless-ngx (fork build)
            BUILD_FROM=${{ steps.flags.outputs.from }}
            BUILD_NAME=Paperless-ngx
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ steps.flags.outputs.tag }}
